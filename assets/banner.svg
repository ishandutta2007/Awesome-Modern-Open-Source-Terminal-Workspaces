<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>

    <!-- Terminal Window Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#111424" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.15); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-anim-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-anim-2 { animation: pulseOrb 7s ease-in-out infinite 3s; transform-origin: 1000px 320px; }
    .card-float-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-float-2 { animation: floatCard2 6s ease-in-out infinite; }
    .cursor-blink { animation: blinkCursor 1s infinite; }
    .beam-path {
      stroke-dasharray: 80 120;
      animation: beamFlow 12s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Matrix Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Dynamic Ambient Glow Orbs in Background -->
  <circle cx="180" cy="90" r="140" fill="#6366f1" filter="url(#neonBlur)" class="orb-anim-1" />
  <circle cx="1020" cy="330" r="160" fill="#ec4899" filter="url(#neonBlur)" class="orb-anim-2" />
  <circle cx="880" cy="80" r="110" fill="#06b6d4" filter="url(#neonBlur)" opacity="0.2"/>

  <!-- Animated Data Flow Streams -->
  <path d="M 0 320 Q 300 240 600 320 T 1200 260" fill="none" stroke="url(#primaryGlow)" stroke-width="2.5" opacity="0.45" class="beam-path"/>
  <path d="M 0 380 Q 400 300 800 390 T 1200 340" fill="none" stroke="url(#cyanNeon)" stroke-width="1.8" opacity="0.35" class="beam-path" style="animation-duration: 9s;"/>

  <!-- Background Floating Mini UI Cards (Decorative) -->
  <!-- Floating GPU/Multiplexer Pill Right -->
  <g class="card-float-1" transform="translate(860, 55)">
    <rect width="280" height="74" rx="12" fill="#181c2e" stroke="#374151" stroke-width="1.2" opacity="0.85"/>
    <circle cx="28" cy="37" r="14" fill="#6366f1" opacity="0.2"/>
    <path d="M22 37 L26 41 L34 32" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="54" y="32" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">GPU-Accelerated Core</text>
    <text x="54" y="52" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Metal · Vulkan · OpenGL · WGPU</text>
  </g>

  <!-- Floating Multiplexer Pill Bottom Right -->
  <g class="card-float-2" transform="translate(890, 275)">
    <rect width="260" height="74" rx="12" fill="#181c2e" stroke="#374151" stroke-width="1.2" opacity="0.85"/>
    <circle cx="26" cy="37" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M20 37 L24 41 L32 32" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="52" y="32" fill="#f3f4f6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Multiplexer &amp; AI Blocks</text>
    <text x="52" y="52" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11">Ghostty · Zellij · WezTerm · Warp</text>
  </g>

  <!-- Main Terminal Stage Window (Always in Foreground) -->
  <g transform="translate(70, 48)">
    <!-- Terminal Outer Frame -->
    <rect width="740" height="324" rx="14" fill="url(#termBg)" stroke="#334155" stroke-width="1.8" filter="url(#subtleBlur)"/>

    <!-- Terminal Window Header -->
    <path d="M 0 14 Q 0 0 14 0 L 726 0 Q 740 0 740 14 L 740 44 L 0 44 Z" fill="#16192b"/>
    <line x1="0" y1="44" x2="740" y2="44" stroke="#252a40" stroke-width="1.5"/>

    <!-- Window Controls (Traffic Lights) -->
    <circle cx="25" cy="22" r="6" fill="#ef4444"/>
    <circle cx="45" cy="22" r="6" fill="#eab308"/>
    <circle cx="65" cy="22" r="6" fill="#22c55e"/>

    <!-- Window Title Tabs -->
    <rect x="95" y="10" width="230" height="25" rx="6" fill="#222842"/>
    <text x="110" y="27" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">⚡ terminal-workspace.zsh</text>

    <text x="340" y="27" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">+ remote:ssh-node</text>

    <!-- Foreground Title & Subtitles -->
    <!-- Shell Command Prompt Line -->
    <text x="36" y="85" fill="#38bdf8" class="mono-text" font-size="14" font-weight="600">developer@workspace</text>
    <text x="205" y="85" fill="#94a3b8" class="mono-text" font-size="14">in</text>
    <text x="230" y="85" fill="#a78bfa" class="mono-text" font-size="14" font-weight="600">~/awesome-terminal-workspaces</text>
    <text x="490" y="85" fill="#f43f5e" class="mono-text" font-size="14">on</text>
    <text x="515" y="85" fill="#fbbf24" class="mono-text" font-size="14" font-weight="600">main 🚀</text>

    <!-- Main Title Heading -->
    <text x="36" y="145" fill="#ffffff" class="title-text" font-size="34">
      Modern Open-Source
    </text>
    <text x="36" y="190" fill="url(#primaryGlow)" class="title-text" font-size="34">
      Terminal &amp; Workspaces
    </text>

    <!-- Subtitle Description Line -->
    <text x="36" y="235" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Next-Gen GPU Emulators · Cloud &amp; SaaS Workspaces · Multiplexers · Modern Shells
    </text>

    <!-- Interactive Badges inside Terminal Screen -->
    <g transform="translate(36, 260)">
      <!-- Badge 1: Rust/Zig Core -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <text x="12" y="18" fill="#c7d2fe" class="mono-text" font-size="11" font-weight="600">⚡ GPU Rendered</text>

      <!-- Badge 2: AI Workspaces -->
      <rect x="145" y="0" width="135" height="28" rx="6" fill="#31102b" stroke="#db2777" stroke-width="1"/>
      <text x="157" y="18" fill="#fbcfe8" class="mono-text" font-size="11" font-weight="600">🤖 AI Augmented</text>

      <!-- Badge 3: Multiplexing -->
      <rect x="290" y="0" width="145" height="28" rx="6" fill="#062e2c" stroke="#0d9488" stroke-width="1"/>
      <text x="302" y="18" fill="#99f6e4" class="mono-text" font-size="11" font-weight="600">🪟 Multiplexing CLI</text>

      <!-- Active Cursor Indicator -->
      <rect x="446" y="6" width="9" height="17" fill="#38bdf8" class="cursor-blink"/>
    </g>
  </g>
</svg>
